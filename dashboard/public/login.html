<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Login — Mission Control</title>
    <meta name="theme-color" content="#E74B1D" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        background: #0A0A0B;
        color: #E5E5E5;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
      }

      .card {
        width: 100%;
        max-width: 380px;
        background: #141416;
        border: 1px solid #2A2A2E;
        border-radius: 12px;
        padding: 2.5rem 2rem 2rem;
      }

      .logo {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 0.25rem;
      }

      .logo-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #E74B1D;
        box-shadow: 0 0 8px rgba(231, 75, 29, 0.4);
      }

      .logo-text {
        font-size: 0.7rem;
        font-family: 'JetBrains Mono', monospace;
        font-weight: 500;
        color: #888;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        font-size: 1.5rem;
        font-weight: 700;
        color: #F5F5F5;
        margin-bottom: 0.25rem;
      }

      .subtitle {
        font-size: 0.8rem;
        color: #666;
        margin-bottom: 2rem;
      }

      .field {
        margin-bottom: 1rem;
      }

      label {
        display: block;
        font-size: 0.75rem;
        font-weight: 500;
        color: #888;
        margin-bottom: 0.375rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      input {
        width: 100%;
        padding: 0.625rem 0.75rem;
        background: #0A0A0B;
        border: 1px solid #2A2A2E;
        border-radius: 6px;
        color: #E5E5E5;
        font-family: inherit;
        font-size: 0.875rem;
        outline: none;
        transition: border-color 0.15s;
      }

      input:focus {
        border-color: #E74B1D;
      }

      button {
        width: 100%;
        padding: 0.7rem;
        margin-top: 0.5rem;
        background: #E74B1D;
        border: none;
        border-radius: 6px;
        color: #fff;
        font-family: inherit;
        font-size: 0.875rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s, opacity 0.15s;
      }

      button:hover { background: #D4411A; }
      button:active { opacity: 0.9; }
      button:disabled { opacity: 0.5; cursor: not-allowed; }

      .error {
        margin-top: 0.75rem;
        padding: 0.5rem 0.75rem;
        background: rgba(231, 75, 29, 0.1);
        border: 1px solid rgba(231, 75, 29, 0.25);
        border-radius: 6px;
        font-size: 0.8rem;
        color: #E74B1D;
        display: none;
      }

      .error.visible { display: block; }

      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        20%, 60% { transform: translateX(-6px); }
        40%, 80% { transform: translateX(6px); }
      }

      .shake { animation: shake 0.4s ease-in-out; }
    </style>
  </head>
  <body>
    <div class="card" id="card">
      <div class="logo">
        <div class="logo-dot"></div>
        <span class="logo-text">OSA Connect</span>
      </div>
      <h1>Mission Control</h1>
      <p class="subtitle">Authenticate to continue</p>

      <form id="login-form" autocomplete="on">
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required />
        </div>
        <button type="submit" id="submit-btn">Sign In</button>
      </form>

      <div class="error" id="error" role="alert">Invalid credentials</div>
    </div>

    <script>
      const form = document.getElementById("login-form");
      const card = document.getElementById("card");
      const errorEl = document.getElementById("error");
      const submitBtn = document.getElementById("submit-btn");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        errorEl.classList.remove("visible");
        submitBtn.disabled = true;
        submitBtn.textContent = "Signing in\u2026";

        try {
          const res = await fetch("/api/auth", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              username: document.getElementById("username").value,
              password: document.getElementById("password").value,
            }),
          });

          if (res.ok) {
            window.location.href = "/";
            return;
          }

          card.classList.remove("shake");
          void card.offsetWidth;
          card.classList.add("shake");
          errorEl.classList.add("visible");
        } catch {
          errorEl.textContent = "Network error";
          errorEl.classList.add("visible");
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = "Sign In";
        }
      });
    </script>
  </body>
</html>
